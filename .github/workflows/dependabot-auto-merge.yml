name: Dependabot auto-merge
on:
  pull_request:
    # The automated t3code update PRs only touch sources.json. Their runs never
    # get a job created and fail once the head branch is gone, so skip them.
    paths-ignore:
      - sources.json
permissions:
  contents: write
  pull-requests: write
jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'ominit/t3code-flake'
    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
