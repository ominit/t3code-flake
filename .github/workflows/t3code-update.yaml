name: Update T3 Code
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
jobs:
  update-t3code:
    name: Update T3 Code
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Check if update is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/update.sh --ci --only-check
      - name: Install Nix
        if: steps.check.outputs.should_update == 'true'
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Update versions
        id: update
        if: steps.check.outputs.should_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/update.sh --ci
      - name: Create update pull request
        id: create-pr
        if: steps.check.outputs.should_update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "${{ steps.update.outputs.commit_message }}"
          title: "${{ steps.update.outputs.commit_message }}"
          body: "Automated T3 Code release update."
          branch: automated/t3code-update
          delete-branch: true
          add-paths: sources.json
      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-url != ''
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
          GH_TOKEN: ${{ github.token }}
